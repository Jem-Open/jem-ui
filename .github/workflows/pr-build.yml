name: PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build Library
    runs-on: ubuntu-latest

    # Job-level, deliberately: a step's own `env` is NOT in scope for that step's `if`, so guarding on
    # a step-level env var would make the condition always false and skip Chromatic silently forever.
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Chromatic finds its baseline by walking git history to the last build it published on an
          # ancestor commit. actions/checkout defaults to fetch-depth: 1 — a single-commit clone with
          # no ancestry — so Chromatic cannot locate a baseline and treats every story as brand new.
          # The result is not a failure but something worse: a green build whose diff says "217
          # changes" on a PR that touched one token, which is indistinguishable from a real
          # regression and trains people to click Approve. 0 fetches full history.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run linter
        run: npm run lint

      - name: Run component regressions
        run: npm run test:components

      - name: Type check
        run: npm run typecheck

      - name: Verify Next.js 16 RSC compatibility
        run: npm run verify:rsc

      - name: Build Storybook
        run: npm run build-storybook

      # Publishes the Storybook for this PR so a change can be reviewed before it reaches a consumer.
      # The design system is mid-restyle, so this deliberately PUBLISHES rather than GATES: `npm run
      # chromatic` carries --exit-zero-on-changes, and failing every PR that intentionally changes a
      # pixel would train people to ignore it. Turn that into a gate once the restyle settles.
      #
      # Skipped rather than failed when CHROMATIC_PROJECT_TOKEN is absent, so a fork PR (which cannot
      # read secrets) still gets a green build instead of a confusing red one.
      - name: Publish Storybook to Chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        run: npm run chromatic
